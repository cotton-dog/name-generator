<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>名字生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 移除点击蓝色高亮 (解决浏览器自带蓝色闪框问题) */
            -webkit-tap-highlight-color: transparent;
        }

        /* CSS 变量定义 */
        :root {
            --page-bg-img: none;
            --page-bg-opacity: 1;
            --card-bg-img: none;
            --card-bg-opacity: 0.85;   /* 默认卡片不透明度 (仅影响伪元素背景) */
            --card-text-color: #1f1b15;
            --focus-outline: none;
        }

        body {
            background: #f2efe8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'Noto Sans CJK SC', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px;
            position: relative;
            background-color: #f2efe8;
        }

        /* 页面背景层 (固定背景图片 + 半透明叠加) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #f2efe8;
            background-image: var(--page-bg-img);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: var(--page-bg-opacity);
            z-index: -2;
        }

        /* 卡片容器：自身背景完全透明，所有背景效果交给伪元素，保证透明度不影响文字 */
        .generator {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            position: relative;
            background: transparent;      /* 卡片本身背景透明，解决透明度干扰 */
            padding: 20px;
            border: 1px solid rgba(200, 190, 175, 0.5);
            color: var(--card-text-color);
            backdrop-filter: none;
        }

        /* 卡片背景伪元素：统一处理背景颜色、图片和透明度，且不影响内部文字 */
        .generator::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* 基础底色: 接近原来 #f2efe8, 让卡片干净 */
            background-color: #f2efe8;
            background-image: var(--card-bg-img);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--card-bg-opacity);
            border: inherit;
            z-index: -1;
            pointer-events: none;
        }

        /* 右上角齿轮设置图标 */
        .global-settings-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            z-index: 100;
            transition: 0.1s;
            outline: none;
        }
        .global-settings-icon:hover {
            opacity: 0.7;
        }
        .global-settings-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #000000;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.1s;
        }

        /* 名字展示区 */
        .hero-name {
            text-align: center;
            margin: 16px 0 28px 0;
            padding: 0 12px;
        }
        .name-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #9a9284;
            margin-bottom: 6px;
            transition: color 0.1s;
        }
        .generated-name {
            font-size: 3rem;
            font-weight: 550;
            letter-spacing: 3px;
            color: inherit;
            line-height: 1.2;
            word-break: break-word;
            background: transparent;
            padding: 12px 8px;
            cursor: pointer;
            display: inline-block;
            transition: background 0.1s;
            outline: none;
        }
        .generated-name:hover {
            background: rgba(0,0,0,0.05);
        }
        .copy-feedback {
            font-size: 0.7rem;
            color: #7f786b;
            margin-top: 6px;
            min-height: 22px;
        }

        /* 操作栏 */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(200, 190, 175, 0.6);
            padding-bottom: 24px;
        }
        .random-icon-btn {
            background: rgba(255,255,255,0.5);
            border: 1px solid #bcb2a3;
            padding: 10px 32px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.1s linear;
            font-family: inherit;
            color: inherit;
            outline: none;
        }
        .random-icon-btn:hover {
            background: rgba(230, 220, 210, 0.8);
            border-color: #958b7a;
        }
        .word-length-selector {
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
        }
        .length-option {
            background: rgba(255,255,255,0.5);
            border: 1px solid #cdc4b7;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            font-weight: 450;
            color: inherit;
            outline: none;
        }
        .length-option.active {
            background: rgba(210, 195, 175, 0.8);
            border-color: #8a7e6c;
            font-weight: 500;
        }
        .length-option:hover {
            background: rgba(220, 210, 195, 0.7);
        }

        /* 姓氏区域 + 名字区域 */
        .surname-section, .name-section {
            margin-bottom: 28px;
            position: relative;
        }
        .mode-switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .mode-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: inherit;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings-mini {
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.03);
            border: 1px solid #cbc1b3;
            transition: 0.1s;
            outline: none;
        }
        .settings-mini:hover {
            background: rgba(0,0,0,0.08);
        }
        .settings-mini svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            transition: stroke 0.1s;
        }
        .toggle-mode-btn {
            background: rgba(255,255,255,0.5);
            border: 1px solid #cbc1b3;
            padding: 5px 16px;
            font-size: 0.75rem;
            cursor: pointer;
            color: inherit;
            font-family: inherit;
            transition: 0.1s;
            outline: none;
        }
        .toggle-mode-btn.active {
            background: rgba(200, 185, 165, 0.7);
            border-color: #8f8270;
            font-weight: 500;
        }
        .input-with-copy {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .button-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .copy-inline-btn, .clear-input-btn {
            background: rgba(255,255,255,0.5);
            border: 1px solid #d4cbbf;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            color: inherit;
            font-family: inherit;
            outline: none;
        }
        .copy-inline-btn:hover, .clear-input-btn:hover {
            background: rgba(210, 195, 175, 0.6);
        }
        .big-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(255,255,255,0.85);
            border: 1px solid #cfc6b9;
            resize: vertical;
            line-height: 1.5;
            color: #1f1d19;
            outline: none;
            transition: background 0.1s, color 0.1s;
        }
        textarea.big-input {
            min-height: 100px;
        }

        /* 遮罩 + 卡片弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #f5f3ef;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #cfc6b9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #ddd8cf;
        }
        .modal-header h3 {
            font-size: 1rem;
            font-weight: 500;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 8px;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid #e0dad1;
        }
        .item-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2b2721;
            flex: 1;
            word-break: break-word;
        }
        .item-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #7a6f60;
            padding: 0 4px;
        }
        .item-actions button:hover {
            color: #000;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: transparent;
            border: 1px solid #bcb2a3;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .action-btn:hover {
            background: #e8e1d7;
        }
        .edit-modal .modal-card {
            max-width: 500px;
        }
        .edit-title-input, .edit-content-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #cfc6b9;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .edit-content-input {
            min-height: 200px;
            resize: vertical;
        }
        .save-btn, .back-btn {
            padding: 8px 20px;
            cursor: pointer;
            font-size: 0.85rem;
            border: 1px solid #bcb2a3;
            background: transparent;
        }
        .save-btn {
            background: #d9d0c4;
            border-color: #8f8270;
        }
        .save-btn:hover {
            background: #c9beaf;
        }
        .back-btn:hover {
            background: #e8e1d7;
        }

        /* 背景设置面板 (悬浮右下角) */
        .bg-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(240, 235, 225, 0.95);
            border: 1px solid #bcb2a3;
            padding: 12px;
            z-index: 200;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(4px);
        }
        .bg-panel.hidden {
            display: none;
        }
        .bg-panel input {
            padding: 6px;
        }
        .bg-panel label {
            font-size: 0.75rem;
        }
        .bg-panel button {
            padding: 4px 8px;
            background: transparent;
            border: 1px solid #bcb2a3;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .generator { max-width: 96%; padding: 16px; }
            .generated-name { font-size: 2.2rem; }
            .bg-panel { width: 220px; }
        }
        /* 移除所有focus时的默认蓝色边框（但保留键盘可用性，仅去掉难看色块） */
        button:focus, .length-option:focus, .random-icon-btn:focus, .toggle-mode-btn:focus, .settings-mini:focus, .global-settings-icon:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
<div class="generator">
    <div class="global-settings-icon" id="globalSettingsBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62l.04-.04Z"/>
            <path d="M16.5 9.4a10 10 0 0 0-9-5.4 10 10 0 0 0-9 5.4"/>
        </svg>
    </div>

    <div class="hero-name">
        <div class="name-label">✦ 生成的名字 ✦</div>
        <div class="generated-name" id="displayName" title="点击复制">——</div>
        <div class="copy-feedback" id="copyToast"></div>
    </div>

    <div class="action-bar">
        <button id="randomGenBtn" class="random-icon-btn">◇ 随机名字 ◇</button>
        <div class="word-length-selector" id="wordLengthGroup">
            <div data-length="1" class="length-option">一字名</div>
            <div data-length="2" class="length-option active">二字名</div>
        </div>
    </div>

    <!-- 姓氏区域 -->
    <div class="surname-section">
        <div class="mode-switch-row">
            <span class="mode-label">姓氏库</span>
            <div class="header-right">
                <button id="surnameModeBtn" class="toggle-mode-btn active">单姓模式</button>
                <div id="surnameSettingsBtn" class="settings-mini">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62l.04-.04Z"/><path d="M16.5 9.4a10 10 0 0 0-9-5.4 10 10 0 0 0-9 5.4"/></svg>
                </div>
            </div>
        </div>
        <div class="input-with-copy">
            <textarea id="surnameInput" class="big-input" rows="2" placeholder="直接输入姓氏，不需要任何分隔符"></textarea>
            <div class="button-row">
                <button id="clearSurnameBtn" class="clear-input-btn">清空</button>
                <button id="copySurnameBtn" class="copy-inline-btn">复制</button>
            </div>
        </div>
    </div>

    <!-- 名字区域 -->
    <div class="name-section">
        <div class="mode-switch-row">
            <span class="mode-label">名字字库</span>
            <div id="nameSettingsBtn" class="settings-mini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62l.04-.04Z"/><path d="M16.5 9.4a10 10 0 0 0-9-5.4 10 10 0 0 0-9 5.4"/></svg>
            </div>
        </div>
        <div class="input-with-copy">
            <textarea id="nameInput" class="big-input" rows="3" placeholder="直接输入名字用字，不需要任何分隔符"></textarea>
            <div class="button-row">
                <button id="clearNameBtn" class="clear-input-btn">清空</button>
                <button id="copyNameBtn" class="copy-inline-btn">复制</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // 存储KEY
        const STORAGE_SINGLE_ITEMS = 'namegen_single_items_v4';
        const STORAGE_DOUBLE_ITEMS = 'namegen_double_items_v4';
        const STORAGE_NAME_ITEMS = 'namegen_name_items_v4';
        const STORAGE_PAGE_BG_IMG = 'namegen_page_bg_img';
        const STORAGE_PAGE_BG_OPACITY = 'namegen_page_bg_opacity';
        const STORAGE_CARD_BG_IMG = 'namegen_card_bg_img';
        const STORAGE_CARD_BG_OPACITY = 'namegen_card_bg_opacity';
        
        // ================= 1. 核心亮度检测函数 (增强版，支持rgb/rgba) =================
        function getBrightnessFromColorString(colorStr) {
            // 如果传入的是rgb/rgba格式，提取数字；否则尝试解析十六进制
            let r, g, b;
            const rgbMatch = colorStr.match(/\d+/g);
            if (rgbMatch && rgbMatch.length >= 3) {
                r = parseInt(rgbMatch[0]);
                g = parseInt(rgbMatch[1]);
                b = parseInt(rgbMatch[2]);
            } else {
                // 简易fallback: 如果不是rgb，尝试用临时元素计算 (极少数情况)
                const div = document.createElement('div');
                div.style.color = colorStr;
                document.body.appendChild(div);
                const computed = getComputedStyle(div).color;
                const fallbackMatch = computed.match(/\d+/g);
                if (fallbackMatch && fallbackMatch.length >= 3) {
                    r = parseInt(fallbackMatch[0]);
                    g = parseInt(fallbackMatch[1]);
                    b = parseInt(fallbackMatch[2]);
                } else {
                    r = 242; g = 239; b = 232; // 默认浅色背景
                }
                document.body.removeChild(div);
            }
            // 心理学亮度公式
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        // 获取任意元素的真实背景亮度 (支持向上追溯透明背景)
        function getEffectiveBackgroundBrightness(element, fallbackBrightness = 220) {
            const bgColor = getComputedStyle(element).backgroundColor;
            if (bgColor === 'rgba(0, 0, 0, 0)' || bgColor === 'transparent') {
                if (element.parentElement) {
                    return getEffectiveBackgroundBrightness(element.parentElement, fallbackBrightness);
                }
                return fallbackBrightness;
            }
            return getBrightnessFromColorString(bgColor);
        }
        
        // ---------- 数据结构 ----------
        let singleItems = [];
        let doubleItems = [];
        let nameItems = [];
        
        let isSingleMode = true;
        let selectedWordLength = 2;   // 1:一字名 2:二字名
        
        let tempSingleInputContent = '';
        let tempDoubleInputContent = '';
        
        // DOM
        const surnameInput = document.getElementById('surnameInput');
        const nameInput = document.getElementById('nameInput');
        const randomBtn = document.getElementById('randomGenBtn');
        const displaySpan = document.getElementById('displayName');
        const copyToast = document.getElementById('copyToast');
        const surnameModeBtn = document.getElementById('surnameModeBtn');
        const copySurnameBtn = document.getElementById('copySurnameBtn');
        const copyNameBtn = document.getElementById('copyNameBtn');
        const clearSurnameBtn = document.getElementById('clearSurnameBtn');
        const clearNameBtn = document.getElementById('clearNameBtn');
        const lengthOptions = document.querySelectorAll('.length-option');
        const generatorDiv = document.querySelector('.generator');
        const globalSettingsBtn = document.getElementById('globalSettingsBtn');
        
        let activeModal = null;
        
        // 保存到localStorage
        function saveToLocal() {
            localStorage.setItem(STORAGE_SINGLE_ITEMS, JSON.stringify(singleItems));
            localStorage.setItem(STORAGE_DOUBLE_ITEMS, JSON.stringify(doubleItems));
            localStorage.setItem(STORAGE_NAME_ITEMS, JSON.stringify(nameItems));
        }
        
        function loadFromLocal() {
            const savedSingle = localStorage.getItem(STORAGE_SINGLE_ITEMS);
            singleItems = savedSingle ? JSON.parse(savedSingle) : [];
            const savedDouble = localStorage.getItem(STORAGE_DOUBLE_ITEMS);
            doubleItems = savedDouble ? JSON.parse(savedDouble) : [];
            const savedName = localStorage.getItem(STORAGE_NAME_ITEMS);
            nameItems = savedName ? JSON.parse(savedName) : [];
        }
        
        function importToSurnameInput(content) {
            surnameInput.value = surnameInput.value + content;
            if (isSingleMode) {
                tempSingleInputContent = surnameInput.value;
            } else {
                tempDoubleInputContent = surnameInput.value;
            }
        }
        
        function importToNameInput(content) {
            nameInput.value = nameInput.value + content;
        }
        
        function clearSurnameInput() {
            surnameInput.value = '';
            if (isSingleMode) {
                tempSingleInputContent = '';
            } else {
                tempDoubleInputContent = '';
            }
        }
        
        function clearNameInput() {
            nameInput.value = '';
        }
        
        // 管理卡片 (保持不变)
        function openManager(type) {
            let items, title, targetType, importFunc;
            if (type === 'surname') {
                items = isSingleMode ? [...singleItems] : [...doubleItems];
                title = isSingleMode ? '单姓库管理' : '复姓库管理';
                targetType = 'surname';
                importFunc = importToSurnameInput;
            } else {
                items = [...nameItems];
                title = '名字库管理';
                targetType = 'name';
                importFunc = importToNameInput;
            }
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <div class="modal-header">
                        <h3>${title}</h3>
                        <button class="modal-close">✕</button>
                    </div>
                    <div class="modal-body">
                        <div class="action-buttons">
                            <button class="action-btn" id="addItemBtn">+ 新增条目</button>
                        </div>
                        <div class="item-list" id="itemListContainer"></div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            activeModal = modal;
            
            function renderList() {
                const container = modal.querySelector('#itemListContainer');
                let currentItems = (type === 'surname') ? (isSingleMode ? singleItems : doubleItems) : nameItems;
                if (currentItems.length === 0) {
                    container.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;">暂无条目，点击 + 新增条目</div>';
                    return;
                }
                container.innerHTML = '';
                currentItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <span class="item-title" title="${escapeHtml(item.content.substring(0, 100))}">${escapeHtml(item.title)}</span>
                        <div class="item-actions">
                            <button class="edit-item" data-id="${item.id}">✏️</button>
                            <button class="import-item" data-id="${item.id}">📥 导入</button>
                            <button class="delete-item" data-id="${item.id}">🗑️</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                
                container.querySelectorAll('.import-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        const item = (type === 'surname') ? (isSingleMode ? singleItems : doubleItems).find(i => i.id == id) : nameItems.find(i => i.id == id);
                        if (item) {
                            importFunc(item.content);
                            modal.remove();
                            activeModal = null;
                        }
                    });
                });
                container.querySelectorAll('.edit-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        openEditModal(type, id);
                    });
                });
                container.querySelectorAll('.delete-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        if (type === 'surname') {
                            if (isSingleMode) singleItems = singleItems.filter(i => i.id != id);
                            else doubleItems = doubleItems.filter(i => i.id != id);
                        } else {
                            nameItems = nameItems.filter(i => i.id != id);
                        }
                        saveToLocal();
                        renderList();
                    });
                });
            }
            
            modal.querySelector('#addItemBtn').addEventListener('click', () => {
                openEditModal(type, null);
            });
            modal.querySelector('.modal-close').addEventListener('click', () => {
                modal.remove();
                activeModal = null;
            });
            renderList();
        }
        
        function openEditModal(type, itemId) {
            let targetItems = (type === 'surname') ? (isSingleMode ? singleItems : doubleItems) : nameItems;
            let editingItem = itemId ? targetItems.find(i => i.id == itemId) : null;
            let titleVal = editingItem ? editingItem.title : '';
            let contentVal = editingItem ? editingItem.content : '';
            
            const editModal = document.createElement('div');
            editModal.className = 'modal-overlay edit-modal';
            editModal.innerHTML = `
                <div class="modal-card">
                    <div class="modal-header">
                        <h3>${editingItem ? '编辑条目' : '新建条目'}</h3>
                        <button class="modal-close">✕</button>
                    </div>
                    <div class="modal-body">
                        <input type="text" id="editTitle" class="edit-title-input" placeholder="标题（显示在列表中）" value="${escapeHtml(titleVal)}">
                        <textarea id="editContent" class="edit-content-input" placeholder="内容（可以写几千字，保存后完整保留）">${escapeHtml(contentVal)}</textarea>
                        <div style="display:flex; gap:12px; justify-content:flex-end;">
                            <button id="backBtn" class="back-btn">返回</button>
                            <button id="saveEditBtn" class="save-btn">保存</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(editModal);
            
            editModal.querySelector('.modal-close').addEventListener('click', () => editModal.remove());
            editModal.querySelector('#backBtn').addEventListener('click', () => editModal.remove());
            editModal.querySelector('#saveEditBtn').addEventListener('click', () => {
                let newTitle = editModal.querySelector('#editTitle').value.trim();
                let newContent = editModal.querySelector('#editContent').value;
                
                if (type === 'surname' && !isSingleMode) {
                    let parts = newContent.split('，').filter(p => p.trim().length > 0);
                    if (parts.length < 1) {
                        alert('复姓模式下，请输入内容！');
                        return;
                    }
                    if (newContent.trim().length > 0 && !newContent.includes('，') && parts.length === 1) {
                        // 允许单个
                    } else if (newContent.includes('，')) {
                        // 正常
                    } else if (newContent.trim().length > 0 && !newContent.includes('，')) {
                        alert('复姓模式下，多个姓氏之间必须用中文逗号“，”隔开！\n例如：欧阳，慕容，诸葛');
                        return;
                    }
                }
                
                if (!newTitle) newTitle = '未命名';
                let newItem = { id: itemId || Date.now() + Math.random(), title: newTitle, content: newContent };
                if (type === 'surname') {
                    if (isSingleMode) {
                        if (editingItem) {
                            const idx = singleItems.findIndex(i => i.id == itemId);
                            if (idx !== -1) singleItems[idx] = newItem;
                        } else singleItems.push(newItem);
                    } else {
                        if (editingItem) {
                            const idx = doubleItems.findIndex(i => i.id == itemId);
                            if (idx !== -1) doubleItems[idx] = newItem;
                        } else doubleItems.push(newItem);
                    }
                } else {
                    if (editingItem) {
                        const idx = nameItems.findIndex(i => i.id == itemId);
                        if (idx !== -1) nameItems[idx] = newItem;
                    } else nameItems.push(newItem);
                }
                saveToLocal();
                editModal.remove();
                if (activeModal) {
                    activeModal.remove();
                    activeModal = null;
                    openManager(type);
                }
            });
        }
        
        function escapeHtml(str) { 
            if(!str) return ''; 
            return str.replace(/[&<>]/g, function(m){ 
                if(m==='&') return '&amp;'; 
                if(m==='<') return '&lt;'; 
                if(m==='>') return '&gt;'; 
                return m;
            });
        }
        
        // 名字生成逻辑 (无变化)
        function getSurnameList() {
            let raw = surnameInput.value;
            if (!raw.trim()) return [];
            if (isSingleMode) {
                return Array.from(raw.trim()).filter(c => c.trim().length > 0);
            } else {
                let rawStr = raw.trim();
                if (rawStr.includes('，')) return rawStr.split('，').map(s=>s.trim()).filter(s=>s);
                else if (rawStr.includes(',')) return rawStr.split(',').map(s=>s.trim()).filter(s=>s);
                else return rawStr ? [rawStr] : [];
            }
        }
        
        function getNameComponentList() {
            let raw = nameInput.value;
            if (!raw.trim()) return [];
            return Array.from(raw.trim()).filter(c => c.trim().length > 0);
        }
        
        function generateFullName() {
            let surnames = getSurnameList();
            if (surnames.length === 0) { 
                displaySpan.innerText = isSingleMode ? "请填写姓氏" : "请填写复姓"; 
                return; 
            }
            let randomSurname = surnames[Math.floor(Math.random() * surnames.length)];
            let nameComps = getNameComponentList();
            if (nameComps.length === 0) { 
                displaySpan.innerText = randomSurname + "？"; 
                return; 
            }
            let givenName = '';
            if (selectedWordLength === 1) {
                givenName = nameComps[Math.floor(Math.random() * nameComps.length)];
            } else {
                if (nameComps.length === 1) {
                    givenName = nameComps[0] + nameComps[0];
                } else {
                    let i1 = Math.floor(Math.random() * nameComps.length);
                    let i2 = Math.floor(Math.random() * nameComps.length);
                    givenName = nameComps[i1] + nameComps[i2];
                }
            }
            displaySpan.innerText = randomSurname + givenName;
        }
        
        async function copyToClipboard(text, msg) {
            if (!text) { 
                if(copyToast) copyToast.innerText='无内容'; 
                setTimeout(()=>{if(copyToast) copyToast.innerText='';},1000); 
                return; 
            }
            try { 
                await navigator.clipboard.writeText(text); 
                if(copyToast) { copyToast.innerText=msg; setTimeout(()=>{if(copyToast) copyToast.innerText='';},1500); } 
            } catch { 
                const ta=document.createElement('textarea'); 
                ta.value=text; 
                document.body.appendChild(ta); 
                ta.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(ta); 
                if(copyToast){ copyToast.innerText=msg; setTimeout(()=>{if(copyToast) copyToast.innerText='';},1500); } 
            }
        }
        
        function switchSurnameMode() {
            if (isSingleMode) {
                tempSingleInputContent = surnameInput.value;
            } else {
                tempDoubleInputContent = surnameInput.value;
            }
            isSingleMode = !isSingleMode;
            surnameModeBtn.innerText = isSingleMode ? '单姓模式' : '复姓模式';
            if (isSingleMode) surnameModeBtn.classList.add('active');
            else surnameModeBtn.classList.remove('active');
            if (isSingleMode) {
                surnameInput.value = tempSingleInputContent;
            } else {
                surnameInput.value = tempDoubleInputContent;
            }
        }
        
        // ========== 修复卡片文字颜色 ==========
        function updateCardTextAndIconsColor() {
            const baseCardColor = "#f2efe8";
            const brightnessBase = getBrightnessFromColorString(baseCardColor);
            const opacity = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-bg-opacity')) || 0.85;
            let textColor;
            if (opacity < 0.4) {
                const bodyBg = getComputedStyle(document.body).backgroundColor;
                textColor = getBrightnessFromColorString(bodyBg) < 128 ? '#ffffff' : '#1f1b15';
            } else {
                textColor = brightnessBase < 128 ? '#ffffff' : '#1f1b15';
            }
            generatorDiv.style.setProperty('--card-text-color', textColor);
            const allSvgs = generatorDiv.querySelectorAll('svg');
            allSvgs.forEach(svg => {
                svg.style.stroke = textColor;
            });
            const allInteractive = generatorDiv.querySelectorAll('.random-icon-btn, .toggle-mode-btn, .copy-inline-btn, .clear-input-btn, .length-option, .mode-label, .big-input, .generated-name, .name-label');
            allInteractive.forEach(el => {
                if (el.classList && el.classList.contains('big-input')) {
                    el.style.color = textColor;
                    el.style.backgroundColor = textColor === '#ffffff' ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.85)';
                } else if (el.classList && el.classList.contains('name-label')) {
                    el.style.color = textColor === '#ffffff' ? '#dddddd' : '#9a9284';
                } else {
                    el.style.color = textColor;
                }
            });
        }
        
        // ========== 修复全局设置图标 (跟随body背景) ==========
        function updateGlobalIconColor() {
            const bodyRealBg = getComputedStyle(document.body).backgroundColor;
            const brightness = getBrightnessFromColorString(bodyRealBg);
            const iconColor = brightness < 128 ? '#ffffff' : '#000000';
            const globalSvg = globalSettingsBtn.querySelector('svg');
            if (globalSvg) {
                globalSvg.style.stroke = iconColor;
            }
        }
        
        function initBackgroundSettings() {
            const savedPageImg = localStorage.getItem(STORAGE_PAGE_BG_IMG);
            const savedPageOpacity = localStorage.getItem(STORAGE_PAGE_BG_OPACITY);
            if (savedPageImg) document.documentElement.style.setProperty('--page-bg-img', `url('${savedPageImg}')`);
            if (savedPageOpacity) document.documentElement.style.setProperty('--page-bg-opacity', savedPageOpacity);
            
            const savedCardImg = localStorage.getItem(STORAGE_CARD_BG_IMG);
            let savedCardOpacity = localStorage.getItem(STORAGE_CARD_BG_OPACITY);
            if (!savedCardOpacity) savedCardOpacity = '0.85';
            if (savedCardImg) document.documentElement.style.setProperty('--card-bg-img', `url('${savedCardImg}')`);
            document.documentElement.style.setProperty('--card-bg-opacity', savedCardOpacity);
            
            updateCardTextAndIconsColor();
            updateGlobalIconColor();
        }
        
        function openBgSettings() {
            let panel = document.getElementById('bgSettingsPanel');
            if (panel) { panel.classList.toggle('hidden'); return; }
            panel = document.createElement('div');
            panel.id = 'bgSettingsPanel';
            panel.className = 'bg-panel';
            panel.innerHTML = `
                <div style="font-weight:bold; margin-bottom:8px;">⚙️ 背景设置</div>
                <div style="border-top:1px solid #ccc; margin:8px 0;"></div>
                <div style="font-size:0.75rem; margin-bottom:4px;">🖼️ 页面背景图</div>
                <input type="file" id="pageBgInput" accept="image/*">
                <label>背景透明度 <span id="pageOpacityValue">1.00</span></label>
                <input type="range" id="pageOpacitySlider" min="0" max="1" step="0.01" value="1">
                <div style="border-top:1px solid #ccc; margin:8px 0;"></div>
                <div style="font-size:0.75rem; margin-bottom:4px;">📇 卡片背景图</div>
                <input type="file" id="cardBgInput" accept="image/*">
                <label>卡片透明度 <span id="cardOpacityValue">0.85</span></label>
                <input type="range" id="cardOpacitySlider" min="0" max="1" step="0.01" value="0.85">
                <div style="border-top:1px solid #ccc; margin:8px 0;"></div>
                <button id="resetAllBgBtn" style="width:100%;">重置所有背景</button>
            `;
            document.body.appendChild(panel);
            const pageOpacitySlider = panel.querySelector('#pageOpacitySlider');
            const pageOpacitySpan = panel.querySelector('#pageOpacityValue');
            const cardOpacitySlider = panel.querySelector('#cardOpacitySlider');
            const cardOpacitySpan = panel.querySelector('#cardOpacityValue');
            const cardFileInput = panel.querySelector('#cardBgInput');
            const pageFileInput = panel.querySelector('#pageBgInput');
            const resetBtn = panel.querySelector('#resetAllBgBtn');
            
            const savedPageOp = localStorage.getItem(STORAGE_PAGE_BG_OPACITY) || '1';
            pageOpacitySlider.value = savedPageOp;
            pageOpacitySpan.innerText = savedPageOp;
            const savedCardOp = localStorage.getItem(STORAGE_CARD_BG_OPACITY) || '0.85';
            cardOpacitySlider.value = savedCardOp;
            cardOpacitySpan.innerText = savedCardOp;
            
            pageOpacitySlider.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                pageOpacitySpan.innerText = val.toFixed(2);
                document.documentElement.style.setProperty('--page-bg-opacity', val);
                localStorage.setItem(STORAGE_PAGE_BG_OPACITY, val);
                updateGlobalIconColor();
            });
            cardOpacitySlider.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                cardOpacitySpan.innerText = val.toFixed(2);
                document.documentElement.style.setProperty('--card-bg-opacity', val);
                localStorage.setItem(STORAGE_CARD_BG_OPACITY, val);
                updateCardTextAndIconsColor();
            });
            pageFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file){
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.documentElement.style.setProperty('--page-bg-img', `url('${ev.target.result}')`);
                        localStorage.setItem(STORAGE_PAGE_BG_IMG, ev.target.result);
                        updateGlobalIconColor();
                    };
                    reader.readAsDataURL(file);
                }
            });
            cardFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file){
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.documentElement.style.setProperty('--card-bg-img', `url('${ev.target.result}')`);
                        localStorage.setItem(STORAGE_CARD_BG_IMG, ev.target.result);
                        updateCardTextAndIconsColor();
                    };
                    reader.readAsDataURL(file);
                }
            });
            resetBtn.addEventListener('click', () => {
                document.documentElement.style.setProperty('--page-bg-img', 'none');
                document.documentElement.style.setProperty('--page-bg-opacity', '1');
                localStorage.removeItem(STORAGE_PAGE_BG_IMG);
                localStorage.setItem(STORAGE_PAGE_BG_OPACITY,'1');
                pageOpacitySlider.value = '1';
                pageOpacitySpan.innerText = '1.00';
                document.documentElement.style.setProperty('--card-bg-img', 'none');
                document.documentElement.style.setProperty('--card-bg-opacity', '0.85');
                localStorage.removeItem(STORAGE_CARD_BG_IMG);
                localStorage.setItem(STORAGE_CARD_BG_OPACITY,'0.85');
                cardOpacitySlider.value = '0.85';
                cardOpacitySpan.innerText = '0.85';
                if(cardFileInput) cardFileInput.value = '';
                if(pageFileInput) pageFileInput.value = '';
                updateCardTextAndIconsColor();
                updateGlobalIconColor();
            });
        }
        
        function init() {
            loadFromLocal();
            surnameInput.value = '';
            nameInput.value = '';
            tempSingleInputContent = '';
            tempDoubleInputContent = '';
            displaySpan.innerText = '点击【随机名字】';
            initBackgroundSettings();
            
            surnameModeBtn.addEventListener('click', switchSurnameMode);
            randomBtn.addEventListener('click', generateFullName);
            copySurnameBtn.addEventListener('click', () => copyToClipboard(surnameInput.value, '姓氏库已复制'));
            copyNameBtn.addEventListener('click', () => copyToClipboard(nameInput.value, '名字库已复制'));
            clearSurnameBtn.addEventListener('click', () => { clearSurnameInput(); });
            clearNameBtn.addEventListener('click', () => { clearNameInput(); });
            displaySpan.addEventListener('click', () => copyToClipboard(displaySpan.innerText, '名字已复制'));
            
            lengthOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    let len = opt.getAttribute('data-length');
                    selectedWordLength = len === '1' ? 1 : 2;
                    lengthOptions.forEach(o=>o.classList.remove('active'));
                    opt.classList.add('active');
                });
            });
            
            surnameInput.addEventListener('input', () => {
                if (isSingleMode) tempSingleInputContent = surnameInput.value;
                else tempDoubleInputContent = surnameInput.value;
            });
            
            document.getElementById('surnameSettingsBtn').addEventListener('click', () => openManager('surname'));
            document.getElementById('nameSettingsBtn').addEventListener('click', () => openManager('name'));
            globalSettingsBtn.addEventListener('click', openBgSettings);
        }
        
        init();
    })();
</script>
</body>
</html>
